name: ci
on: [push, pull_request]
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --check desktop/plugin.js
      - run: cd tests && npm ci --no-audit --no-fund && npm test
      - run: python3 -c "import ast,sys; ast.parse(open('__init__.py').read()); print('agent half parses')"
      - run: pip install "fastapi==0.115.*" "httpx==0.27.*" && python3 tests/test_plugin_api.py
