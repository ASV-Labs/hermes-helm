name: Feature request
description: Suggest something helm should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, in your words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you picture it working. Sketches welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Desk, Needs you / approvals, Session pane / plan, Customize look / theme, Bots board / robots, Something new]
