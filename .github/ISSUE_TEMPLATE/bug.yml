name: Bug report
description: Something in helm isn't working as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [troubleshooting guide](https://github.com/ASV-Labs/hermes-helm/blob/main/docs/guides/troubleshooting.md) first — many issues are covered there.
        **Never paste API keys, `.env` contents or auth files.** helm never needs them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw. Screenshots help.
    validations:
      required: true
  - type: input
    id: diagnostics
    attributes:
      label: Helm diagnostics
      description: "Run **Helm: diagnostics** from ⌘K and paste the line it shows."
  - type: input
    id: hermes
    attributes:
      label: Hermes version
      description: Output of `hermes --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Desk, Needs you / approvals, Session pane / plan, Customize look / theme, Bots board / robots, Install / update, Other]
